name: P3 five-corner fixed MOS VCO capacitance and pump-strength search
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'simulation/p3_common_cap_pump_pvt.py'
      - '.github/workflows/p3_common_cap_pump_pvt.yml'
permissions:
  contents: read
jobs:
  common-pvt:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        corner: [tt, ff, ss, fs, sf]
        scale: [0.8, 0.9, 1.0, 1.1, 1.25]
    steps:
      - uses: actions/checkout@v4
      - name: Install ngspice
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ngspice unzip
      - name: Verify DB HiTek private model
        run: bash scripts/run_dbhitek_smoke.sh
      - name: Test single common VCO load and pump strength in physical MOS closed reference PLL
        run: python3 simulation/p3_common_cap_pump_pvt.py --corner ${{ matrix.corner }} --scale ${{ matrix.scale }}
      - name: Preserve each physical PLL pass and fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fixed-MOS-PVT-${{ matrix.corner }}-${{ matrix.scale }}
          retention-days: 90
          if-no-files-found: warn
          path: results/spice/p3_common_cap_pump_PVT/
