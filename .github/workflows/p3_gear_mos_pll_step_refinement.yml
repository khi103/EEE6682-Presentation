name: P3 Gear 1ps 2ps 3ps transistor MOS extreme PVT convergence
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'simulation/p3_gear_mos_pll_step_refinement.py'
      - '.github/workflows/p3_gear_mos_pll_step_refinement.yml'
permissions:
  contents: read
jobs:
  convergence:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        design: [diode_w16_r4k, diode_w8_r8k]
        step: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - name: Install actual MOS ngspice and unzip
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ngspice unzip
      - name: Verify existing authorized 180nm MOS model
        run: bash scripts/run_dbhitek_smoke.sh
      - name: Repeat identical SS high-temperature low-voltage MOS PLL with Gear timestep
        run: >
          python3 simulation/p3_gear_mos_pll_step_refinement.py
          --design ${{ matrix.design }}
          --step ${{ matrix.step }}
      - name: Retain actual physical MOS numeric and electrical failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: physical-MOS-Gear-step-${{ matrix.design }}-${{ matrix.step }}
          retention-days: 90
          if-no-files-found: warn
          path: results/spice/p3_gear_MOS_refinement/
