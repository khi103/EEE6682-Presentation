name: P3 7bit saturating digital CDR up-down counter XSPICE realization
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'simulation/p3_xspice_7bit_saturating_counter.py'
      - '.github/workflows/p3_xspice_7bit_saturating_counter.yml'
permissions:
  contents: read
jobs:
  pdk-free-counter:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install XSPICE ngspice
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ngspice
      - name: Generate and execute 128-state seven-bit digital phase counter
        run: python3 simulation/p3_xspice_7bit_saturating_counter.py
      - name: Retain digital state machine source and measured transient
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p3-seven-bit-XSPICE-counter-qualification
          retention-days: 90
          if-no-files-found: warn
          path: results/digital/p3_XSPICE_7bit_saturating_counter/
