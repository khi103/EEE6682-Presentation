name: P3 FF SS independent physical MOS charge-pump source sink tuning
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'simulation/p3_asym_mos_pump_pvt.py'
      - '.github/workflows/p3_asym_mos_pump_pvt.yml'
permissions:
  contents: read
jobs:
  source-sink:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        corner: [ff, ss]
        source-scale: [0.85, 0.95, 1.05]
        sink-scale: [0.7, 0.8, 0.9]
    steps:
      - uses: actions/checkout@v4
      - name: Install ngspice
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ngspice unzip
      - name: Verify DB HiTek device models
        run: bash scripts/run_dbhitek_smoke.sh
      - name: Test real MOS reference PLL under asymmetric 7bit current-sink/source strength
        run: >
          python3 simulation/p3_asym_mos_pump_pvt.py
          --corner ${{ matrix.corner }}
          --source-scale ${{ matrix.source-scale }}
          --sink-scale ${{ matrix.sink-scale }}
      - name: Retain all pass and fail records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p3-mos-asym-pump-${{ matrix.corner }}-${{ matrix.source-scale }}-${{ matrix.sink-scale }}
          retention-days: 90
          if-no-files-found: warn
          path: results/spice/p3_asym_mos_CP_PVT/
