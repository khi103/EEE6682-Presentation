name: P3 180nm segmented NMOS TX impedance power and PVT

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'simulation/p3_transistor_driver.py'
      - 'simulation/plot_p3_driver.py'
      - 'simulation/p3_gate_bias_authority.py'
      - 'simulation/p3_rx_noise_jitter_sensitivity.py'
      - 'scripts/validate_p3_driver_results.py'
      - 'scripts/prepare_ngspice_model.py'
      - '.github/workflows/p3_driver_spice.yml'

permissions:
  contents: write

jobs:
  simulate-p3-driver:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out private workspace
        uses: actions/checkout@v4
      - name: Install ngspice and plotting dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ngspice unzip python3 python3-pip
          python3 -m pip install --user --break-system-packages matplotlib
          ngspice --version | head -n 3
      - name: Check MOS model compatibility on CMOS inverter
        run: |
          bash scripts/run_dbhitek_smoke.sh
          python3 scripts/validate_dbhitek_inverter.py
      - name: Reconstruct 8-4-2-1 NMOS TX driver and simulate
        run: |
          python3 simulation/p3_transistor_driver.py --symbols 128
      - name: Test PVT gate-bias control authority (not physical feedback)
        run: python3 simulation/p3_gate_bias_authority.py
      - name: Test added Gaussian RX noise and sampling jitter
        run: python3 simulation/p3_rx_noise_jitter_sensitivity.py --trials 2000
      - name: Render voltage-code, output resistance, corner and power plots
        run: |
          python3 simulation/plot_p3_driver.py
      - name: Verify numerical correctness, not just ngspice exit code
        run: python3 scripts/validate_p3_driver_results.py
      - name: Archive derived CSV and JSON permanently in this private repository
        # This commits ONLY student-generated numerical evidence, never PDK coefficients.
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f results/spice/p3_segmented_driver/driver_summary.json \
                     results/spice/p3_segmented_driver/tt_code_sweep.csv \
                     results/spice/p3_segmented_driver/pvt_corner_sweep.csv \
                     results/spice/p3_segmented_driver/gate_bias_authority.csv \
                     results/spice/p3_segmented_driver/gate_bias_authority.json \
                     results/spice/p3_segmented_driver/rx_noise_jitter_robustness.csv \
                     results/spice/p3_segmented_driver/rx_noise_jitter_robustness.json
          if ! git diff --cached --quiet; then
            git commit -m "results: archive verified MOS driver DC, PVT and transient metrics"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
      - name: Publish simulation evidence only (exclude foundry PDK)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p3-reconstructed-180nm-segmented-driver-results
          retention-days: 90
          if-no-files-found: warn
          path: |
            results/spice/p3_segmented_driver/*.csv
            results/spice/p3_segmented_driver/*.json
            results/spice/p3_segmented_driver/*.png
            pdk_private/ngspice_compat/smoke_ngspice.log
            pdk_private/ngspice_compat/smoke_metrics.json
