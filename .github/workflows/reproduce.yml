name: Reproduce P3 behavioral figures
on:
  push:
    paths:
      - 'simulation/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/reproduce.yml'
  workflow_dispatch:
jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run quantitative tests
        run: pytest -q tests/test_p3.py
      - name: Run modified course-script methodology for P3
        run: python simulation/sim3_ffe_P3_adapted.py --out results
      - name: Export editable Veusz datasets
        run: python simulation/export_veusz.py
      - uses: actions/upload-artifact@v4
        with:
          name: p3-simulation-and-validation
          path: |
            results/
            veusz/
