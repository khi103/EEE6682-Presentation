name: Reproduce P3 behavioral figures
on:
  push:
    paths:
      - 'simulation/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/reproduce.yml'
  workflow_dispatch:
jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install scientific dependencies
        run: pip install -r requirements.txt
      - name: Unit tests
        run: pytest -q tests/test_p3.py
      - name: Regenerate figures and JSON
        run: python simulation/p3_reproduce.py --out results
      - uses: actions/upload-artifact@v4
        with:
          name: p3-figures-and-results
          path: results/
