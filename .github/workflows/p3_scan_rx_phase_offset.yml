name: P3 physical MOS no-feedback receiver phase-offset challenge map
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/p3_scan_rx_phase_offset.py'
      - '.github/workflows/p3_scan_rx_phase_offset.yml'
permissions:
  contents: read
jobs:
  phase:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        shift: [-0.85, -0.65, -0.45, -0.25, -0.05, 0.15, 0.55, 0.75, 0.95]
    steps:
      - uses: actions/checkout@v4
      - name: Install physical MOS SPICE simulator
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ngspice unzip
      - name: Verify DB HiTek private model
        run: bash scripts/run_dbhitek_smoke.sh
      - name: Sweep receiver starting phase with fixed MOS delay and no feedback
        run: python3 scripts/p3_scan_rx_phase_offset.py --shift ${{ matrix.shift }}
      - name: Preserve negative evidence for selecting feedback challenge tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nofeedback-MOS-phase-${{ matrix.shift }}
          retention-days: 90
          if-no-files-found: warn
          path: results/spice/p3_mos_phase_offset_baseline/
