name: P3 single DAC XSPICE digital undefined-node diagnostic
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'simulation/p3_xspice_one_stage_probe.py'
      - '.github/workflows/p3_xspice_one_stage_probe.yml'
permissions:
  contents: read
jobs:
  one-digital-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        node: [drx, dclke, dD0, dE0, du0, dd0]
        shift: [0.95, -0.05]
    steps:
      - uses: actions/checkout@v4
      - name: Install XSPICE-enabled ngspice
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ngspice unzip
      - name: Validate existing MOS model
        run: bash scripts/run_dbhitek_smoke.sh
      - name: Probe one digital XSPICE node with physical MOS TX RX and PLL
        run: python3 simulation/p3_xspice_one_stage_probe.py --node ${{ matrix.node }} --shift ${{ matrix.shift }}
      - name: Preserve full or truncated digital probe diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p3-4XOR-digital-one-probe-${{ matrix.node }}-${{ matrix.shift }}
          retention-days: 90
          if-no-files-found: warn
          path: results/spice/p3_xspice_one_probe/
