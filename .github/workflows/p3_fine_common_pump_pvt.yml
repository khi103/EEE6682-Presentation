name: P3 fine fixed-design MOS PLL full-five-corner pass search
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'simulation/p3_fine_common_pump_pvt.py'
      - '.github/workflows/p3_fine_common_pump_pvt.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 15
      matrix:
        corner: [tt, ff, ss, fs, sf]
        scale: [0.825, 0.85, 0.875]
    steps:
      - uses: actions/checkout@v4
      - name: Install ngspice
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ngspice unzip
      - name: Verify private DB HiTek MOS
        run: bash scripts/run_dbhitek_smoke.sh
      - name: Test one globally shared MOS pump and VCO sizing
        run: python3 simulation/p3_fine_common_pump_pvt.py --corner ${{ matrix.corner }} --scale ${{ matrix.scale }}
      - name: Preserve every MOS PLL outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p3-global-MOS-PLL-overlap-${{ matrix.corner }}-${{ matrix.scale }}
          retention-days: 90
          if-no-files-found: warn
          path: results/spice/p3_fine_common_MOS_PLL/
