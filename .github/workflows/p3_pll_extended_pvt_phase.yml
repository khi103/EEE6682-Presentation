name: P3 validated MOS PLL PVT temperature voltage cycle-slip survey
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'simulation/p3_pll_extended_pvt_phase.py'
      - '.github/workflows/p3_pll_extended_pvt_phase.yml'
permissions:
  contents: read
jobs:
  pvt:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      max-parallel: 14
      matrix:
        include:
          - { corner: tt, temp: -20, vdd: 1.80 }
          - { corner: tt, temp: 27, vdd: 1.80 }
          - { corner: tt, temp: 85, vdd: 1.80 }
          - { corner: ff, temp: -20, vdd: 1.80 }
          - { corner: ff, temp: 27, vdd: 1.80 }
          - { corner: ff, temp: 85, vdd: 1.80 }
          - { corner: ss, temp: -20, vdd: 1.80 }
          - { corner: ss, temp: 27, vdd: 1.80 }
          - { corner: ss, temp: 85, vdd: 1.80 }
          - { corner: fs, temp: -20, vdd: 1.80 }
          - { corner: fs, temp: 27, vdd: 1.80 }
          - { corner: fs, temp: 85, vdd: 1.80 }
          - { corner: sf, temp: -20, vdd: 1.80 }
          - { corner: sf, temp: 27, vdd: 1.80 }
          - { corner: sf, temp: 85, vdd: 1.80 }
          - { corner: tt, temp: 27, vdd: 1.71 }
          - { corner: tt, temp: 27, vdd: 1.89 }
          - { corner: ff, temp: 27, vdd: 1.71 }
          - { corner: ff, temp: 27, vdd: 1.89 }
          - { corner: ss, temp: 27, vdd: 1.71 }
          - { corner: ss, temp: 27, vdd: 1.89 }
    steps:
      - uses: actions/checkout@v4
      - name: Install ngspice with mixed-signal XSPICE
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ngspice unzip
      - name: Verify authorized DB HiTek 180nm model
        run: bash scripts/run_dbhitek_smoke.sh
      - name: Verify 3fF fixed-VCO-reference-PLL process, temperature, supply and frequency slip
        run: python3 simulation/p3_pll_extended_pvt_phase.py --corner ${{ matrix.corner }} --temp ${{ matrix.temp }} --vdd ${{ matrix.vdd }}
      - name: Save every electrical pass or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p3-PLL-strict-${{ matrix.corner }}-${{ matrix.temp }}-${{ matrix.vdd }}
          retention-days: 90
          if-no-files-found: warn
          path: results/spice/p3_extensive_MOS_PLL_PVT/
